<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Compra de Códigos</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: auto;
  margin-top: 40px;
  padding: 20px;
  background: #111827;
  border-radius: 15px;
}

h1 { color: gold; }

.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px 0;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-3px) scale(1.03);
}

.card.selected {
  background: linear-gradient(45deg, gold, orange);
  color: black;
  transform: scale(1.08);
  box-shadow: 0 0 25px rgba(255,215,0,0.9);
  border: 2px solid gold;
}

.card.selected::after {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
  transform: rotate(25deg);
  animation: brilloMove 1s;
}

@keyframes brilloMove {
  from { transform: translateX(-100%) rotate(25deg); }
  to { transform: translateX(100%) rotate(25deg); }
}

.card.disabled {
  opacity: 0.4;
  transform: scale(0.95);
  pointer-events: none;
  filter: grayscale(60%);
}

input {
  width: 90%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
  border: none;
}

button {
  padding: 12px;
  width: 95%;
  margin-top: 10px;
  border: none;
  background: gold;
  color: black;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  position: relative;
}
button:hover { transform: scale(1.05); }

button.loading {
  background: #555;
  color: transparent;
  cursor: not-allowed;
}
button.loading::after {
  content: "Procesando...";
  color: white;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

#casino {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
}
.ruleta {
  font-size: 100px;
  animation: girar 1s infinite linear;
}
@keyframes girar {
  100% { transform: rotate(360deg); }
}

.codigo {
  display:inline-block;
  padding:10px;
  margin:5px;
  background:#1f2937;
  border-radius:8px;
  opacity: 0;
  transform: scale(0.8);
  animation: aparecer 0.4s forwards;
}
@keyframes aparecer {
  to { opacity: 1; transform: scale(1); }
}

@keyframes brillo {
  from { box-shadow: 0 0 10px gold; }
  to { box-shadow: 0 0 25px orange; }
}
.dorado {
  background:linear-gradient(45deg,gold,orange);
  color:black;
  font-weight:bold;
  border:2px solid gold;
  animation: brillo 1s infinite alternate;
}

.redes {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  gap: 15px;
}
.redes a {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #1f2937;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.3s;
  text-decoration: none;
}
.redes a:hover {
  transform: scale(1.2);
  background: gold;
}
.redes svg {
  width: 22px;
  height: 22px;
  fill: white;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 65px;
  height: 65px;
  background: #25D366;
  border-radius: 50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  z-index: 9999;
  animation: pulse 1.5s infinite;
  text-decoration: none;
}
.whatsapp-float svg {
  width: 30px;
  height: 30px;
  fill: white;
}

#success {
  display:none;
  margin-top:20px;
  color:gold;
}
</style>
</head>

<body>

<div id="casino">
  <div class="ruleta">🎰</div>
</div>

<div class="container">

<h1>🎟️ Compra tus códigos</h1>
<h1>Gana 15 millones COP</h1>

<div style="margin:15px; color:gold;">
💎 Solo existen <strong>4 códigos dorados por el valor de 500 mil pesos cada uno</strong>
</div>

<!-- BARRA DE PROGRESO -->
<div style="margin:15px 0; text-align:left;">
  <div style="display:flex; justify-content:space-between; font-size:13px; color:#9ca3af; margin-bottom:6px;">
    <span>Códigos vendidos</span>
    <span id="txtProgreso">Cargando...</span>
  </div>
  <div style="background:#1f2937; border-radius:999px; height:14px; overflow:hidden;">
    <div id="barraProgreso" style="height:100%; width:0%; background:linear-gradient(90deg, gold, orange); border-radius:999px; transition:width 1s ease;"></div>
  </div>
</div>

<!-- CÓDIGOS DORADOS SALIDOS -->
<div id="seccionDorados" style="display:none; margin:15px 0; padding:12px; background:#020617; border-radius:10px; border:1px solid gold;">
  <div style="font-size:13px; color:gold; margin-bottom:8px;">💎 Códigos dorados entregados</div>
  <div id="listaDorados" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;"></div>
</div>

<div id="success">
  <h2>✅ Pago confirmado</h2>
</div>

<h3>Selecciona paquete</h3>

<div class="card" data-cantidad="4">4 códigos<br><strong>$1.500</strong></div>
<div class="card" data-cantidad="8">8 códigos<br><strong>$40.000</strong></div>
<div class="card" data-cantidad="16">16 códigos<br><strong>$80.000</strong></div>

<div id="form" style="display:none;">
  <input id="nombre" placeholder="Nombre">
  <input id="cedula" placeholder="Cédula">
  <input id="telefono" placeholder="Teléfono">
  <input id="correo" placeholder="Correo">
  <input id="direccion" placeholder="Dirección">
  <button id="btnPagar">Pagar ahora</button>
</div>

<hr>

<h3>Consultar códigos</h3>
<input id="buscar" placeholder="Correo o Cédula">
<button onclick="consultar()">Buscar</button>

<div id="resultado"></div>

<!-- REDES -->
<div class="redes">
  <a href="https://facebook.com" target="_blank" title="Facebook">
    <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
  </a>
  <a href="https://instagram.com" target="_blank" title="Instagram">
    <svg viewBox="0 0 24 24"><path fill="#E4405F" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
  </a>
  <a href="mailto:correo@gmail.com" target="_blank" title="Email">
    <svg viewBox="0 0 24 24"><path fill="#FF6B35" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
  </a>
</div>

</div>

<!-- WHATSAPP -->
<a href="https://wa.me/573053228703?text=Hola quiero comprar códigos" class="whatsapp-float" target="_blank">
  <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<script>
document.addEventListener("DOMContentLoaded", () => {

const API_URL = window.location.origin;
let cantidad = 0;

const cards = document.querySelectorAll(".card");
const form = document.getElementById("form");

async function verificarStock() {
  try {
    const res = await fetch(`${API_URL}/api/progreso`);
    const data = await res.json();

    const pct = Math.min(data.porcentaje || 0, 100);
    document.getElementById("barraProgreso").style.width = pct + "%";
    document.getElementById("txtProgreso").innerText = pct.toFixed(1) + "%";

    if (data.disponibles <= 0) {
      cards.forEach(c => c.classList.add("disabled"));
      form.style.display = "none";
      alert("🚫 Códigos agotados");
    }

    const resDorados = await fetch(`${API_URL}/api/admin/codigos-dorados`);
    const dorados = await resDorados.json();

    if (dorados && dorados.length > 0) {
      document.getElementById("seccionDorados").style.display = "block";
      const lista = document.getElementById("listaDorados");
      lista.innerHTML = "";
      dorados.forEach(d => {
        const span = document.createElement("span");
        span.innerText = "✨ " + d.codigo;
        span.style.cssText = "background:linear-gradient(45deg,gold,orange);color:black;padding:6px 12px;border-radius:8px;font-weight:bold;font-size:14px;";
        lista.appendChild(span);
      });
    }

  } catch (e) {
    console.log("Error verificando stock");
  }
}

verificarStock();

cards.forEach(card => {
  card.addEventListener("click", () => {
    if (card.classList.contains("disabled")) return;
    cards.forEach(c => c.classList.remove("selected","disabled"));
    card.classList.add("selected");
    cards.forEach(c => {
      if (c !== card) c.classList.add("disabled");
    });
    cantidad = parseInt(card.dataset.cantidad);
    form.style.display = "block";
    form.style.opacity = 0;
    setTimeout(() => {
      form.style.transition = "all 0.3s";
      form.style.opacity = 1;
    }, 50);
  });
});

window.consultar = async function() {
  try {
    const valor = document.getElementById("buscar").value;
    if (!valor) return alert("Ingresa correo o cédula");

    const res = await fetch(`${API_URL}/api/mis-codigos`, {
      method:"POST",
      headers:{ "Content-Type":"application/json"},
      body: JSON.stringify({dato: valor})
    });

    const data = await res.json();
    const resultado = document.getElementById("resultado");
    resultado.innerHTML = "";

    if (!data.codigos || data.codigos.length === 0) {
      resultado.innerHTML = "❌ No se encontraron códigos";
      return;
    }

    data.codigos.forEach((c, index) => {
      const div = document.createElement("div");
      div.className = "codigo";
      setTimeout(() => {
        div.innerText = c.dorado ? "✨ " + c.codigo + " ✨" : c.codigo;
        if (c.dorado) div.classList.add("dorado");
      }, index * 120);
      resultado.appendChild(div);
    });

  } catch (error) {
    alert("Error consultando");
  }
};

const btnPagar = document.getElementById("btnPagar");
const casino = document.getElementById("casino");

btnPagar.addEventListener("click", async () => {
  if (!cantidad) {
    alert("Selecciona un paquete");
    return;
  }

  const nombre = document.getElementById("nombre").value.trim();
  const cedula = document.getElementById("cedula").value.trim();
  const telefono = document.getElementById("telefono").value.trim();
  const correo = document.getElementById("correo").value.trim();
  const direccion = document.getElementById("direccion").value.trim();

  if (!nombre || !correo || !cedula || !telefono) {
    alert("Completa todos los datos");
    return;
  }

  btnPagar.classList.add("loading");
  casino.style.display = "flex";

  try {
    const res = await fetch(`${API_URL}/api/crear-transaccion`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cliente: { nombre, cedula, telefono, correo, direccion },
        cantidad
      })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.error || "Error en compra");
      btnPagar.classList.remove("loading");
      casino.style.display = "none";
      verificarStock();
      return;
    }

    if (!data || !data.tx) {
      throw new Error("Respuesta inválida");
    }

    const params = new URLSearchParams({
      "public-key": data.publicKey,
      currency: "COP",
      "amount-in-cents": data.tx.amount_in_cents,
      reference: data.tx.reference,
      "signature:integrity": data.tx.signature.integrity,
      "redirect-url": `${API_URL}?status=success`
    });

    window.location.href = `https://checkout.wompi.co/p/?mode=widget&${params.toString()}`;

  } catch (err) {
    console.error(err);
    alert("Error en el pago");
    btnPagar.classList.remove("loading");
    casino.style.display = "none";
  }
});

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("status") === "success") {
  document.getElementById("success").style.display = "block";
}

});
</script>

</body>
</html>
