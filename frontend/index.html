<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Compra de Códigos</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: auto;
  margin-top: 40px;
  padding: 20px;
  background: #111827;
  border-radius: 15px;
}

h1 { color: gold; }

/* 🔥 CARDS PRO */
.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px 0;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-3px) scale(1.03);
}

/* SELECCIONADO */
.card.selected {
  background: linear-gradient(45deg, gold, orange);
  color: black;
  transform: scale(1.08);
  box-shadow: 0 0 25px rgba(255,215,0,0.9);
  border: 2px solid gold;
}

/* BRILLO */
.card.selected::after {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
  transform: rotate(25deg);
  animation: brilloMove 1s;
}

@keyframes brilloMove {
  from { transform: translateX(-100%) rotate(25deg); }
  to { transform: translateX(100%) rotate(25deg); }
}

/* DESHABILITADAS */
.card.disabled {
  opacity: 0.4;
  transform: scale(0.95);
  pointer-events: none;
  filter: grayscale(60%);
}

/* INPUTS */
input {
  width: 90%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
  border: none;
}

/* BOTONES */
button {
  padding: 12px;
  width: 95%;
  margin-top: 10px;
  border: none;
  background: gold;
  color: black;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  position: relative;
}
button:hover { transform: scale(1.05); }

/* BOTÓN LOADING */
button.loading {
  background: #555;
  color: transparent;
  cursor: not-allowed;
}
button.loading::after {
  content: "Procesando...";
  color: white;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

/* LOADER */
#casino {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
}
.ruleta {
  font-size: 100px;
  animation: girar 1s infinite linear;
}
@keyframes girar {
  100% { transform: rotate(360deg); }
}

/* CODIGOS */
.codigo {
  display:inline-block;
  padding:10px;
  margin:5px;
  background:#1f2937;
  border-radius:8px;
  opacity: 0;
  transform: scale(0.8);
  animation: aparecer 0.4s forwards;
}
@keyframes aparecer {
  to { opacity: 1; transform: scale(1); }
}

/* DORADO */
@keyframes brillo {
  from { box-shadow: 0 0 10px gold; }
  to { box-shadow: 0 0 25px orange; }
}
.dorado {
  background:linear-gradient(45deg,gold,orange);
  color:black;
  font-weight:bold;
  border:2px solid gold;
  animation: brillo 1s infinite alternate;
}

/* REDES */
.redes {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  gap: 15px;
}
.redes a {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #1f2937;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.3s;
  text-decoration: none;
}
.redes a:hover {
  transform: scale(1.2);
  background: gold;
}
.redes svg {
  width: 22px;
  height: 22px;
  fill: white;
}

/* WHATSAPP */
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 65px;
  height: 65px;
  background: #25D366;
  border-radius: 50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  z-index: 9999;
  animation: pulse 1.5s infinite;
  text-decoration: none;
}
.whatsapp-float svg {
  width: 30px;
  height: 30px;
  fill: white;
}

#success {
  display:none;
  margin-top:20px;
  color:gold;
}
</style>
</head>

<body>

<div id="casino">
  <div class="ruleta">🎰</div>
</div>

<div class="container">

<h1>🎟️ Compra tus códigos</h1>
<h1>Gana 15 millones COP</h1>

<div style="margin:15px; color:gold;">
💎 Solo existen <strong>4 códigos dorados por el valor de 500 mil pesos cada uno </strong>
</div>

<div id="success">
  <h2>✅ Pago confirmado</h2>
</div>

<h3>Selecciona paquete</h3>

<div class="card" data-cantidad="4">4 códigos<br><strong>$1.500</strong></div>
<div class="card" data-cantidad="8">8 códigos<br><strong>$40.000</strong></div>
<div class="card" data-cantidad="16">16 códigos<br><strong>$80.000</strong></div>

<div id="form" style="display:none;">
  <input id="nombre" placeholder="Nombre">
  <input id="cedula" placeholder="Cédula">
  <input id="telefono" placeholder="Teléfono">
  <input id="correo" placeholder="Correo">
  <input id="direccion" placeholder="Dirección">
  <button id="btnPagar">Pagar ahora</button>
</div>

<hr>

<h3>Consultar códigos</h3>
<input id="buscar" placeholder="Correo o Cédula">
<button onclick="consultar()">Buscar</button>

<div id="resultado"></div>

<!-- REDES -->
<div class="redes"> ... (todo igual como ya lo tenías) </div>

</div>

<!-- WHATSAPP -->
<a href="https://wa.me/573053228703?text=Hola quiero comprar códigos" class="whatsapp-float" target="_blank">
...
</a>

<script>
document.addEventListener("DOMContentLoaded", () => {

const API_URL = window.location.origin;
let cantidad = 0;

const cards = document.querySelectorAll(".card");
const form = document.getElementById("form");

/* 🔥 SELECCIÓN PRO */
cards.forEach(card => {
  card.addEventListener("click", () => {

    cards.forEach(c => c.classList.remove("selected","disabled"));

    card.classList.add("selected");

    cards.forEach(c => {
      if (c !== card) c.classList.add("disabled");
    });

    cantidad = parseInt(card.dataset.cantidad);

    form.style.display = "block";
    form.style.opacity = 0;

    setTimeout(() => {
      form.style.transition = "all 0.3s";
      form.style.opacity = 1;
    }, 50);

  });
});

/* CONSULTAR (igual tuyo) */
window.consultar = async function() {
  try {
    const valor = document.getElementById("buscar").value;
    if (!valor) return alert("Ingresa correo o cédula");

    const res = await fetch(`${API_URL}/api/mis-codigos`, {
      method:"POST",
      headers:{ "Content-Type":"application/json"},
      body: JSON.stringify({dato: valor})
    });

    const data = await res.json();
    const resultado = document.getElementById("resultado");
    resultado.innerHTML = "";

    if (!data.codigos || data.codigos.length === 0) {
      resultado.innerHTML = "❌ No se encontraron códigos";
      return;
    }

    data.codigos.forEach((c, index) => {
      const div = document.createElement("div");
      div.className = "codigo";

      setTimeout(() => {
        div.innerText = c.dorado ? "✨ " + c.codigo + " ✨" : c.codigo;
        if (c.dorado) div.classList.add("dorado");
      }, index * 120);

      resultado.appendChild(div);
    });

  } catch (error) {
    alert("Error consultando");
  }
};

/* PAGAR (igual tuyo) */
const btnPagar = document.getElementById("btnPagar");
const casino = document.getElementById("casino");

btnPagar.addEventListener("click", async () => {

  if (!cantidad) return alert("Selecciona un paquete");

  const nombre = document.getElementById("nombre").value;
  const cedula = document.getElementById("cedula").value;
  const telefono = document.getElementById("telefono").value;
  const correo = document.getElementById("correo").value;
  const direccion = document.getElementById("direccion").value;

  if (!nombre || !correo) return alert("Completa los datos");

  btnPagar.classList.add("loading");
  casino.style.display = "flex";

  try {

    const res = await fetch(`${API_URL}/api/crear-transaccion`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cliente: { nombre, cedula, telefono, correo, direccion },
        cantidad
      })
    });

    const data = await res.json();

    const params = new URLSearchParams({
      "public-key": data.publicKey,
      currency: "COP",
      "amount-in-cents": data.tx.amount_in_cents,
      reference: data.tx.reference,
      "signature:integrity": data.tx.signature,
      "redirect-url": `${API_URL}/?status=success`
    });

    window.location.href = `https://checkout.wompi.co/p/?mode=widget&${params}`;

  } catch (err) {
    alert("Error en pago");
  }

});

/* SUCCESS */
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("status") === "success") {
  document.getElementById("success").style.display = "block";
}

});
</script>

</body>
</html>
