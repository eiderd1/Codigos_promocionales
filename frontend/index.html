<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Compra de Códigos</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: auto;
  margin-top: 40px;
  padding: 20px;
  background: #111827;
  border-radius: 15px;
}

h1 { color: gold; }

.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  cursor: pointer;
}

.card:hover { transform: scale(1.05); }

input {
  width: 90%;
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 12px;
  width: 95%;
  margin-top: 10px;
  border: none;
  background: gold;
  color: black;
  font-weight: bold;
  border-radius: 10px;
}

.progress {
  margin-top: 20px;
  background: #374151;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 20px;
  background: gold;
  width: 0%;
}

/* 🎰 loading */
#casino {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
}

.ruleta {
  font-size: 100px;
  animation: girar 1s infinite;
}

@keyframes girar {
  100% { transform: rotate(360deg); }
}

/* ✅ success */
#success {
  display:none;
  margin-top:20px;
  color:gold;
}

/* 🏆 ganadores */
.ganador {
  background:black;
  color:gold;
  padding:10px;
  margin:5px;
  border-radius:10px;
  font-size:20px;
}

/* 🎟️ códigos */
.codigo {
  display:inline-block;
  padding:10px;
  margin:5px;
  background:#1f2937;
  border-radius:8px;
}

.dorado {
  background:linear-gradient(45deg,gold,orange);
  color:black;
  font-weight:bold;
  box-shadow:0 0 10px gold;
}
</style>
</head>

<body>

<div id="casino">
  <div class="ruleta">🎰</div>
</div>

<div class="container">

<h1>🎟️ Compra tus códigos</h1>

<div id="success">
  <h2>✅ Pago confirmado</h2>
  <p>Revisa tu correo y WhatsApp</p>
</div>

<h3>Selecciona paquete</h3>

<div class="card" onclick="seleccionar(20)">20 códigos<br><strong>$10.000</strong></div>
<div class="card" onclick="seleccionar(40)">40 códigos<br><strong>$20.000</strong></div>
<div class="card" onclick="seleccionar(60)">60 códigos<br><strong>$30.000</strong></div>

<div id="form" style="display:none;">
  <h3>Datos</h3>
  <input id="nombre" placeholder="Nombre">
  <input id="cedula" placeholder="Cédula">
  <input id="telefono" placeholder="Teléfono">
  <input id="correo" placeholder="Correo">
  <input id="direccion" placeholder="Dirección">
  <button onclick="pagar()">Pagar ahora</button>
</div>

<hr>

<h2>🔎 Consultar mis códigos</h2>

<input id="buscar" placeholder="Correo o Cédula">
<button onclick="consultar()">Buscar</button>

<div id="resultado"></div>

<hr>

<h3>🏆 Números Ganadores</h3>
<div id="ganadores"></div>

</div>

<script>

let cantidad = 0;

// ========================
// seleccionar paquete
// ========================
function seleccionar(c) {
  cantidad = c;
  document.getElementById("form").style.display = "block";
}

// ========================
// pagar wompi
// ========================
async function pagar() {

  const nombre = nombreInput.value;
  const cedula = cedulaInput.value;
  const telefono = telefonoInput.value;
  const correo = correoInput.value;
  const direccion = direccionInput.value;

  if (!nombre || !correo) {
    alert("Completa los datos");
    return;
  }

  casino.style.display = "flex";

  try {

    const res = await fetch("https://codigos-promocionales-qmmz.onrender.com/api/crear-transaccion", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cliente: { nombre, cedula, telefono, correo, direccion },
        cantidad
      })
    });

    const data = await res.json();

    const params = new URLSearchParams({
      "public-key": data.publicKey,
      currency: "COP",
      "amount-in-cents": data.tx.amount_in_cents,
      reference: data.tx.reference,
      "signature:integrity": data.tx.signature,
      "redirect-url": "https://codigos-promocionales-qmmz.onrender.com/?status=success"
    });

    window.location.href = `https://checkout.wompi.co/p/?mode=widget&${params.toString()}`;

  } catch (error) {
    alert("Error en el pago");
  }
}

// ========================
// detectar pago exitoso
// ========================
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("status") === "success") {
  success.style.display = "block";
}

// ========================
// consultar códigos
// ========================
async function consultar() {

  const valor = buscar.value;

  if (!valor) {
    alert("Ingresa correo o cédula");
    return;
  }

  const res = await fetch("https://codigos-promocionales-qmmz.onrender.com/api/mis-codigos", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ dato: valor })
  });

  const data = await res.json();

  const contenedor = resultado;

  contenedor.innerHTML = "";

  if (!data.codigos || data.codigos.length === 0) {
    contenedor.innerHTML = "<p>No tienes códigos</p>";
    return;
  }

  data.codigos.forEach(c => {
    const div = document.createElement("div");

    div.className = "codigo";

    if (c.dorado) {
      div.classList.add("dorado");
      div.innerText = c.codigo + " ✨";
    } else {
      div.innerText = c.codigo;
    }

    contenedor.appendChild(div);
  });

}

// ========================
// ganadores (demo)
// ========================
function mostrarGanadores(lista){
  ganadores.innerHTML =
    lista.map(n => `<div class="ganador">${n}</div>`).join("");
}

mostrarGanadores(["1234","5678","9999"]);

</script>

</body>
</html>
