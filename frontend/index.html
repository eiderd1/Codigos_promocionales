<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Compra de Códigos</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: auto;
  margin-top: 40px;
  padding: 20px;
  background: #111827;
  border-radius: 15px;
}

h1 { color: gold; }

.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  cursor: pointer;
}

.card:hover { transform: scale(1.05); }

input {
  width: 90%;
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 12px;
  width: 95%;
  margin-top: 10px;
  border: none;
  background: gold;
  color: black;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
}

#casino {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
}

.ruleta {
  font-size: 100px;
  animation: girar 1s infinite;
}

@keyframes girar {
  100% { transform: rotate(360deg); }
}

#success {
  display:none;
  margin-top:20px;
  color:gold;
}

.codigo {
  display:inline-block;
  padding:10px;
  margin:5px;
  background:#1f2937;
  border-radius:8px;
}

.dorado {
  background:linear-gradient(45deg,gold,orange);
  color:black;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="casino">
  <div class="ruleta">🎰</div>
</div>

<div class="container">

<h1>🎟️ Compra tus códigos</h1>

<div id="success">
  <h2>✅ Pago confirmado</h2>
  <p>Revisa tu correo y WhatsApp</p>
</div>

<h3>Selecciona paquete</h3>

<div class="card" onclick="seleccionar(20)">20 códigos<br><strong>$10.000</strong></div>
<div class="card" onclick="seleccionar(40)">40 códigos<br><strong>$20.000</strong></div>
<div class="card" onclick="seleccionar(60)">60 códigos<br><strong>$30.000</strong></div>

<div id="form" style="display:none;">
  <h3>Datos</h3>
  <input id="nombre" placeholder="Nombre">
  <input id="cedula" placeholder="Cédula">
  <input id="telefono" placeholder="Teléfono">
  <input id="correo" placeholder="Correo">
  <input id="direccion" placeholder="Dirección">
  <button id="btnPagar" onclick="pagar()">Pagar ahora</button>
</div>

<hr>

<h2>🔎 Consultar mis códigos</h2>

<input id="buscar" placeholder="Correo o Cédula">
<button onclick="consultar()">Buscar</button>

<div id="resultado"></div>

</div>

<script>

// ========================
// ELEMENTOS
// ========================
const casino = document.getElementById("casino");
const success = document.getElementById("success");
const buscar = document.getElementById("buscar");
const resultado = document.getElementById("resultado");
const btnPagar = document.getElementById("btnPagar");

let cantidad = 0;

// ========================
// seleccionar paquete
// ========================
function seleccionar(c) {
  cantidad = c;
  document.getElementById("form").style.display = "block";
}

// ========================
// pagar wompi
// ========================
async function pagar() {

  const nombre = document.getElementById("nombre").value;
  const cedula = document.getElementById("cedula").value;
  const telefono = document.getElementById("telefono").value;
  const correo = document.getElementById("correo").value;
  const direccion = document.getElementById("direccion").value;

  if (!cantidad) {
    alert("Selecciona un paquete");
    return;
  }

  if (!nombre || !correo) {
    alert("Completa los datos obligatorios");
    return;
  }

  casino.style.display = "flex";
  btnPagar.disabled = true;

  try {

    const res = await fetch("https://codigos-promocionales-qmmz.onrender.com/api/crear-transaccion", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cliente: { nombre, cedula, telefono, correo, direccion },
        cantidad
      })
    });

    if (!res.ok) {
      throw new Error("Error en servidor");
    }

    const data = await res.json();

    if (!data.tx) {
      throw new Error("Respuesta inválida");
    }

    const params = new URLSearchParams({
      "public-key": data.publicKey,
      currency: "COP",
      "amount-in-cents": data.tx.amount_in_cents,
      reference: data.tx.reference,
      "signature:integrity": data.tx.signature,
      "redirect-url": "https://codigos-promocionales-qmmz.onrender.com/?status=success"
    });

    window.location.href = `https://checkout.wompi.co/p/?mode=widget&${params.toString()}`;

  } catch (error) {
    console.error(error);
    casino.style.display = "none";
    btnPagar.disabled = false;
    alert("Error en el pago");
  }
}

// ========================
// detectar pago exitoso
// ========================
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("status") === "success") {
  success.style.display = "block";
}

// ========================
// consultar códigos
// ========================
async function consultar() {

  const valor = buscar.value;

  if (!valor) {
    alert("Ingresa correo o cédula");
    return;
  }

  try {

    const res = await fetch("https://codigos-promocionales-qmmz.onrender.com/api/mis-codigos", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ dato: valor })
    });

    const data = await res.json();

    resultado.innerHTML = "";

    if (!data.codigos || data.codigos.length === 0) {
      resultado.innerHTML = "<p>No tienes códigos</p>";
      return;
    }

    data.codigos.forEach(c => {
      const div = document.createElement("div");

      div.className = "codigo";

      if (c.dorado) {
        div.classList.add("dorado");
        div.innerText = c.codigo + " ✨";
      } else {
        div.innerText = c.codigo;
      }

      resultado.appendChild(div);
    });

  } catch (error) {
    console.error(error);
    alert("Error consultando códigos");
  }
}

</script>

</body>
</html>
