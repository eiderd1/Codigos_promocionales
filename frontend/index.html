<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Compra de Códigos</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  text-align: center;
}

.container {
  max-width: 400px;
  margin: auto;
  margin-top: 40px;
  padding: 20px;
  background: #111827;
  border-radius: 15px;
}

h1 { color: gold; }

.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  cursor: pointer;
}

.card:hover { transform: scale(1.05); }

input {
  width: 90%;
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 12px;
  width: 95%;
  margin-top: 10px;
  border: none;
  background: gold;
  color: black;
  font-weight: bold;
  border-radius: 10px;
}

.progress {
  margin-top: 20px;
  background: #374151;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 20px;
  background: gold;
  width: 0%;
}

#casino {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
}

.ruleta {
  font-size: 100px;
  animation: girar 1s infinite;
}

@keyframes girar {
  100% { transform: rotate(360deg); }
}

#contador { color: #facc15; }
</style>
</head>

<body>

<div id="casino">
  <div class="ruleta">🎰</div>
</div>

<div class="container">

<h1>🎟️ Compra tus códigos</h1>
<h3 id="contador">Selecciona un paquete</h3>

<h3>Selecciona paquete</h3>

<div class="card" onclick="seleccionar(20)">20 códigos<br><strong>$10.000</strong></div>
<div class="card" onclick="seleccionar(40)">40 códigos<br><strong>$20.000</strong></div>
<div class="card" onclick="seleccionar(60)">60 códigos<br><strong>$30.000</strong></div>

<div id="form" style="display:none;">
  <h3>Datos</h3>
  <input id="nombre" placeholder="Nombre">
  <input id="cedula" placeholder="Cédula">
  <input id="telefono" placeholder="Teléfono">
  <input id="correo" placeholder="Correo">
  <input id="direccion" placeholder="Dirección">
  <button onclick="pagar()">Pagar ahora</button>
</div>

<h3>Progreso</h3>
<div class="progress">
  <div id="barra" class="progress-bar"></div>
</div>

</div>

<script>

let cantidad = 0;

function seleccionar(c) {
  cantidad = c;
  document.getElementById("form").style.display = "block";
}

async function pagar() {

  const nombre = document.getElementById("nombre").value;
  const cedula = document.getElementById("cedula").value;
  const telefono = document.getElementById("telefono").value;
  const correo = document.getElementById("correo").value;
  const direccion = document.getElementById("direccion").value;

  if (!nombre || !correo) {
    alert("Completa los datos");
    return;
  }

  document.getElementById("casino").style.display = "flex";

  try {

    const res = await fetch("/api/crear-transaccion", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cliente: { nombre, cedula, telefono, correo, direccion },
        cantidad
      })
    });

    const data = await res.json();

    console.log("TX COMPLETO:", data);

    if (!data.tx) {
      alert("Error en pago");
      return;
    }

    if (!data.tx.amount_in_cents) {
      alert("Monto inválido");
      return;
    }

    // ✅ URL WOMPI CORRECTA (SIN expiration)
    const params = new URLSearchParams({
      "public-key": data.publicKey,
      currency: "COP",
      "amount-in-cents": data.tx.amount_in_cents,
      reference: data.tx.reference,
      "signature": data.tx.signature,
      "redirect-url": window.location.origin + "/?status=success"
    });

    const url = `https://checkout.wompi.co/p/?mode=widget&${params.toString()}`;

    console.log("✅ URL WOMPI:", url);

    window.location.href = url;

  } catch (error) {
    console.error(error);
    alert("Error al procesar el pago");
  }
}

</script>

</body>
</html>
