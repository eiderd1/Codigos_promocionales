<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Compra de Códigos</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: auto;
  margin-top: 40px;
  padding: 20px;
  background: #111827;
  border-radius: 15px;
}

h1 { color: gold; }

/* ===================== */
/* CARDS */
/* ===================== */
.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.card:hover { transform: scale(1.05); }

.card.selected {
  background: linear-gradient(45deg, gold, orange);
  color: black;
  transform: scale(1.07);
  box-shadow: 0 0 20px rgba(255,215,0,0.7);
  border: 2px solid gold;
}

/* ===================== */
/* INPUTS Y BOTÓN */
/* ===================== */
input {
  width: 90%;
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 12px;
  width: 95%;
  margin-top: 10px;
  border: none;
  background: gold;
  color: black;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
  position: relative;
}

button:hover { transform: scale(1.05); }

button.loading {
  background: #555;
  color: transparent;
  cursor: not-allowed;
}

button.loading::after {
  content: "Procesando...";
  color: white;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

/* ===================== */
/* CASINO LOADER */
/* ===================== */
#casino {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
}

.ruleta {
  font-size: 100px;
  animation: girar 1s infinite linear;
}

@keyframes girar {
  100% { transform: rotate(360deg); }
}

/* ===================== */
/* CÓDIGOS */
/* ===================== */
.codigo {
  display:inline-block;
  padding:10px;
  margin:5px;
  background:#1f2937;
  border-radius:8px;
  opacity: 0;
  transform: scale(0.8);
  animation: aparecer 0.4s forwards;
}

@keyframes aparecer {
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* DORADOS */
@keyframes brilloDorado {
  0% { transform: scale(0.8); opacity: 0; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes brillo {
  from { box-shadow: 0 0 10px gold; }
  to { box-shadow: 0 0 25px orange; }
}
.dorado {
  background:linear-gradient(45deg,gold,orange);
  color:black;
  font-weight:bold;
  box-shadow: 0 0 15px gold;
   transform: scale(1.1);
   border: 2px solid gold;
  animation: brillo 1s infinite alternate;
}

/* ===================== */
/* BARRA DE PROGRESO */
/* ===================== */
.barra-container {
  width: 100%;
  background: #1f2937;
  border-radius: 10px;
  margin: 15px 0;
  overflow: hidden;
}

.barra {
  height: 20px;
  width: 0%;
  background: linear-gradient(90deg, gold, orange);
  transition: width 0.8s ease;
}

.barra-texto {
  margin-top: 5px;
  font-size: 14px;
  color: gold;
}

/* ===================== */
#success {
  display:none;
  margin-top:20px;
  color:gold;
}
</style>
</head>

<body>

<div id="casino">
  <div class="ruleta">🎰</div>
</div>

<div class="container">

<h1>🎟️ Compra tus códigos</h1>
<h1>Gana 15 millones de pesos cop</h1>

<div id="success">
  <h2>✅ Pago confirmado</h2>
  <p>Revisa tu correo y WhatsApp</p>
</div>

<h3>Selecciona paquete</h3>
el ganador del codigo sale al llegar el 100 % con la de medellin
<div class="card" data-cantidad="20">20 códigos<br><strong>$10.000</strong></div>
<div class="card" data-cantidad="40">40 códigos<br><strong>$20.000</strong></div>
<div class="card" data-cantidad="60">60 códigos<br><strong>$30.000</strong></div>

<div id="form" style="display:none;">
  <h3>Datos</h3>
  <input id="nombre" placeholder="Nombre">
  <input id="cedula" placeholder="Cédula">
  <input id="telefono" placeholder="Teléfono">
  <input id="correo" placeholder="Correo">
  <input id="direccion" placeholder="Dirección">
  <button id="btnPagar">Pagar ahora</button>
</div>

<hr>

<h2>🔎 Consultar mis códigos</h2>

<input id="buscar" placeholder="Correo o Cédula">
<button onclick="consultar()">Buscar</button>

<!-- BARRA -->
<div class="barra-container">
  <div id="barra" class="barra"></div>
</div>
<div id="barraTexto" class="barra-texto"></div>

<div id="resultado"></div>

</div>

<script>

const casino = document.getElementById("casino");
const success = document.getElementById("success");
const buscar = document.getElementById("buscar");
const resultado = document.getElementById("resultado");
const btnPagar = document.getElementById("btnPagar");

let cantidad = 0;

/* ===================== */
/* SELECCIÓN */
/* ===================== */
const cards = document.querySelectorAll(".card");

cards.forEach(card => {
  card.addEventListener("click", () => {
    cantidad = parseInt(card.dataset.cantidad);
    localStorage.setItem("cantidadSeleccionada", cantidad);

    cards.forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");

    document.getElementById("form").style.display = "block";
  });
});

window.addEventListener("load", () => {
  const guardado = localStorage.getItem("cantidadSeleccionada");

  if (guardado) {
    cantidad = parseInt(guardado);

    cards.forEach(card => {
      if (parseInt(card.dataset.cantidad) === cantidad) {
        card.classList.add("selected");
        document.getElementById("form").style.display = "block";
      }
    });
  }
});

/* ===================== */
/* PAGAR */
/* ===================== */
btnPagar.addEventListener("click", pagar);

async function pagar() {

  if (btnPagar.classList.contains("loading")) return;

  const nombre = document.getElementById("nombre").value;
  const cedula = document.getElementById("cedula").value;
  const telefono = document.getElementById("telefono").value;
  const correo = document.getElementById("correo").value;
  const direccion = document.getElementById("direccion").value;

  if (!cantidad) return alert("Selecciona un paquete");
  if (!nombre || !correo) return alert("Completa los datos");

  btnPagar.classList.add("loading");
  btnPagar.disabled = true;
  casino.style.display = "flex";

  try {

    const res = await fetch("https://codigos-promocionales-qmmz.onrender.com/api/crear-transaccion", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cliente: { nombre, cedula, telefono, correo, direccion },
        cantidad
      })
    });

    const data = await res.json();

    const params = new URLSearchParams({
      "public-key": data.publicKey,
      currency: "COP",
      "amount-in-cents": data.tx.amount_in_cents,
      reference: data.tx.reference,
      "signature:integrity": data.tx.signature,
      "redirect-url": "https://codigos-promocionales-qmmz.onrender.com/?status=success"
    });

    window.location.href = `https://checkout.wompi.co/p/?mode=widget&${params}`;

  } catch (err) {
    console.log(err);
    alert("Error en el pago");
    btnPagar.classList.remove("loading");
    btnPagar.disabled = false;
    casino.style.display = "none";
  }
}

/* ===================== */
/* SUCCESS */
/* ===================== */
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("status") === "success") {
  success.style.display = "block";
}

/* ===================== */
/* CONSULTAR */
/* ===================== */
async function consultar() {

  const valor = buscar.value;
  if (!valor) return alert("Ingresa correo o cédula");

  try {

    const res = await fetch("https://codigos-promocionales-qmmz.onrender.com/api/mis-codigos", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ dato: valor })
    });

    const data = await res.json();
    resultado.innerHTML = "";

    if (!data.codigos?.length) {
      resultado.innerHTML = "<p>No tienes códigos</p>";
      return;
    }

    let dorados = 0;

    data.codigos.forEach((c, index) => {

      const div = document.createElement("div");
      div.className = "codigo";

      setTimeout(() => {

        const esDorado = c.dorado === true || c.dorado === "true" || c.dorado === 1;

        if (esDorado) {
          dorados++;
          div.classList.add("dorado");
          div.innerText = "✨ " + c.codigo + " ✨";
        } else {
          div.innerText = c.codigo;
        }

      }, index * 120);

      resultado.appendChild(div);
    });

    const total = data.codigos.length;

    setTimeout(() => {

      const porcentaje = total > 0 ? Math.round((dorados / total) * 100) : 0;

      document.getElementById("barra").style.width = porcentaje + "%";
      document.getElementById("barraTexto").innerText =
        `✨ ${dorados} dorados de ${total} (${porcentaje}%)`;

    }, data.codigos.length * 120 + 300);

  } catch (err) {
    console.log(err);
    alert("Error consultando códigos");
  }
}

</script>

</body>
</html>
