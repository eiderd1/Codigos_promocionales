<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado del pago</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  text-align:center;
  padding:20px;
}

.card{
  background:#111827;
  border:1px solid rgba(245,197,24,.2);
  border-radius:20px;
  padding:40px 30px;
  max-width:450px;
  width:100%;
  box-shadow:0 0 40px rgba(0,0,0,.4);
}

.icon{
  font-size:70px;
  margin-bottom:20px;
}

h1{
  margin-bottom:10px;
}

p{
  color:#cbd5e1;
  line-height:1.6;
  font-size:15px;
}

.btn{
  margin-top:25px;
  display:inline-block;
  background:linear-gradient(135deg,#f5c518,#f97316);
  color:#000;
  text-decoration:none;
  padding:14px 22px;
  border-radius:12px;
  font-weight:bold;
}

.success{
  color:#22c55e;
}

.error{
  color:#ef4444;
}

.pending{
  color:#facc15;
}

</style>
</head>

<body>

<div class="card">

  <div class="icon" id="icon">
    ⏳
  </div>

  <h1 id="titulo">
    Verificando pago...
  </h1>

  <p id="mensaje">
    Estamos validando el estado de tu transacción.
  </p>

  <a href="/" class="btn">
    Volver al inicio
  </a>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const status =
  params.get("status") ||
  params.get("transactionStatus");

const icon =
  document.getElementById("icon");

const titulo =
  document.getElementById("titulo");

const mensaje =
  document.getElementById("mensaje");

switch(status){

  // APROBADO
  case "APPROVED":
  case "approved":
  case "success":

    icon.innerHTML = "✅";

    titulo.innerHTML =
      "Pago confirmado";

    titulo.classList.add("success");

    mensaje.innerHTML = `
      Tu compra fue procesada correctamente.<br><br>
      Los códigos fueron enviados a tu correo electrónico.<br>
      Revisa también spam o promociones.
    `;

  break;

  // RECHAZADO
  case "DECLINED":
  case "ERROR":
  case "FAILED":
  case "rejected":

    icon.innerHTML = "❌";

    titulo.innerHTML =
      "Pago rechazado";

    titulo.classList.add("error");

    mensaje.innerHTML = `
      Tu pago no pudo ser procesado.<br><br>
      Puedes intentar nuevamente con otro método de pago.
    `;

  break;

  // PENDIENTE
  case "PENDING":
  case "pending":

    icon.innerHTML = "⏳";

    titulo.innerHTML =
      "Pago pendiente";

    titulo.classList.add("pending");

    mensaje.innerHTML = `
      Tu pago está siendo validado por la entidad bancaria.<br><br>
      Te notificaremos cuando sea confirmado.
    `;

  break;

  // DEFAULT
  default:

    icon.innerHTML = "ℹ️";

    titulo.innerHTML =
      "Estado desconocido";

    mensaje.innerHTML = `
      No pudimos verificar el estado del pago.<br><br>
      Si el dinero fue debitado, espera unos minutos
      y revisa tu correo.
    `;

}

</script>

</body>
</html>
