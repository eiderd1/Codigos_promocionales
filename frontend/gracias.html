<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago exitoso</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  text-align:center;
  padding:20px;
}

.card{
  background:#111827;
  border:1px solid rgba(245,197,24,.2);
  border-radius:20px;
  padding:40px 30px;
  max-width:450px;
  width:100%;
  box-shadow:0 0 40px rgba(0,0,0,.4);
}

.icon{
  font-size:70px;
  margin-bottom:20px;
}

h1{
  color:#f5c518;
  margin-bottom:10px;
}

p{
  color:#cbd5e1;
  line-height:1.6;
  font-size:15px;
}

.btn{
  margin-top:25px;
  display:inline-block;
  background:linear-gradient(135deg,#f5c518,#f97316);
  color:#000;
  text-decoration:none;
  padding:14px 22px;
  border-radius:12px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

  <div class="icon">
    ✅
  </div>

  <h1>Pago confirmado</h1>

  <p>
    Tu compra fue procesada correctamente.
    Los códigos fueron enviados a tu correo electrónico.
  </p>

  <p>
    Revisa también la carpeta de spam o promociones.
  </p>

  <a href="/" class="btn">
    Volver al inicio
  </a>

</div>

</body>
</html>
